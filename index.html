<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    /* ===== Marca Historias y un Café ===== */
    :root {
      --teal: #008080; --teal-d: #005f61; --sage: #5C857D; --aqua: #9FCFCA;
      --gold: #A57F50; --gold-l: #E4CFA9; --gold-t: #7F6038; --ink: #24272A;

      --bg: #F3F1EC; --surface: #FFFFFF; --surface-2: #F5F4F0; --line: rgba(36,39,42,.09);
      --text: #24272A; --muted: #646D71;
      --accent: #007b7b; --accent-soft: rgba(0,128,128,.10); --on-accent: #FFFFFF;
      --up: #0b7d6f; --down: #8a5d2b;
      --hero: linear-gradient(140deg, #008080 0%, #0a6c6e 52%, #3f7a74 100%);
      --shadow: 0 1px 2px rgba(36,39,42,.05), 0 12px 28px -16px rgba(36,39,42,.28);

      --av0: #008080; --av1: #A57F50; --av2: #5C857D; --av3: #24272A; --av4: #9FCFCA;
      --heat1: rgba(0,128,128,.16); --heat2: rgba(0,128,128,.38); --heat3: rgba(0,128,128,.66); --heat4: #007373; --heat-ink: #FFFFFF;
      --r: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #15181A; --surface: #202426; --surface-2: #2A2F32; --line: rgba(237,237,237,.10);
        --text: #EDEDED; --muted: #9DA6A9;
        --accent: #52C0B8; --accent-soft: rgba(82,192,184,.14); --on-accent: #06292b;
        --up: #6fd6c9; --down: #dcb27a; --gold-t: #D8BC8B;
        --hero: linear-gradient(140deg, #0b5658 0%, #0b4244 55%, #26403f 100%);
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.7);
        --av3: #4A5358;
        --heat1: rgba(82,192,184,.16); --heat2: rgba(82,192,184,.36); --heat3: rgba(82,192,184,.62); --heat4: #3aa8a0; --heat-ink: #06292b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15181A; --surface: #202426; --surface-2: #2A2F32; --line: rgba(237,237,237,.10);
      --text: #EDEDED; --muted: #9DA6A9;
      --accent: #52C0B8; --accent-soft: rgba(82,192,184,.14); --on-accent: #06292b;
      --up: #6fd6c9; --down: #dcb27a; --gold-t: #D8BC8B;
      --hero: linear-gradient(140deg, #0b5658 0%, #0b4244 55%, #26403f 100%);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.7);
      --av3: #4A5358;
      --heat1: rgba(82,192,184,.16); --heat2: rgba(82,192,184,.36); --heat3: rgba(82,192,184,.62); --heat4: #3aa8a0; --heat-ink: #06292b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Raleway', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      font-feature-settings: 'lnum' 1, 'tnum' 1;
      background: var(--bg); color: var(--text);
      transition: background .3s, color .3s;
    }
    button { font-family: inherit; color: inherit; }
    svg { display: block; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

    /* ===== Cargando ===== */
    #loader {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      transition: opacity .5s, visibility .5s;
    }
    #loader.out { opacity: 0; visibility: hidden; }
    #loader svg { width: 96px; height: 96px; animation: spin 3.2s cubic-bezier(.6,0,.3,1) infinite; }
    #loader p { margin: 0; font-weight: 700; letter-spacing: .04em; color: var(--muted); animation: pulse 1.6s ease-in-out infinite; }

    /* ===== Hero ===== */
    .hero {
      position: relative; isolation: isolate; overflow: hidden; color: #fff; background: var(--hero);
      padding: max(18px, env(safe-area-inset-top)) 0 72px; border-radius: 0 0 34px 34px;
    }
    .fx { position: absolute; z-index: -1; color: #fff; pointer-events: none; animation: drift 18s ease-in-out infinite; }
    .fx.a { width: 230px; right: -60px; top: -50px; opacity: .09; }
    .fx.b { width: 130px; left: -34px; bottom: 36px; opacity: .07; animation-delay: -6s; }
    .fx.c { width: 64px; right: 36%; bottom: 14px; opacity: .22; color: var(--gold-l); animation-delay: -11s; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .seal { position: relative; width: 82px; height: 82px; flex: none; }
    .seal-ring { position: absolute; inset: 0; width: 100%; height: 100%; color: rgba(255,255,255,.92); animation: spin 48s linear infinite; }
    .seal-core { position: absolute; inset: 17px; border-radius: 50%; background: #EDEDED; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.22); }
    .seal-core img { width: 30px; height: auto; }
    h1 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
    .sub { margin: 4px 0 0; font-size: 13px; font-weight: 500; opacity: .88; }
    .actions { display: flex; gap: 8px; flex: none; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); cursor: pointer;
      background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s, transform .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.26); }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn.spin svg { animation: spin .9s linear infinite; }

    .controls { display: grid; gap: 10px; margin-top: 22px; }
    .glass { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: 999px; padding: 4px; }
    .seg button {
      position: relative; z-index: 1; border: 0; background: none; color: #fff; cursor: pointer;
      font-size: 14.5px; font-weight: 700; padding: 11px 0; border-radius: 999px; transition: color .25s;
    }
    .seg button[aria-selected="true"] { color: var(--teal-d); }
    .seg-pill {
      position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: #fff; border-radius: 999px;
      box-shadow: 0 4px 12px rgba(0,0,0,.18); transition: transform .38s cubic-bezier(.3,1.35,.5,1);
    }
    .seg[data-tab="mes"] .seg-pill { transform: translateX(100%); }

    .nav { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px; }
    .nav-btn {
      width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.12); display: grid; place-items: center; transition: background .2s, transform .2s;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.26); }
    .nav-btn:active:not(:disabled) { transform: scale(.9); }
    .nav-btn:disabled { opacity: .28; cursor: default; }
    .nav-btn svg { width: 18px; height: 18px; }
    .nav-label { position: relative; flex: 1; min-width: 0; text-align: center; line-height: 1.2; }
    .nav-eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-l); }
    .nav-main { display: block; font-size: 16.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-label select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
    .nav-today {
      flex: none; border: 0; cursor: pointer; border-radius: 999px; padding: 10px 14px; font-size: 12.5px; font-weight: 800;
      background: var(--gold-l); color: var(--ink); transition: transform .2s;
    }
    .nav-today:active { transform: scale(.94); }

    @media (max-width: 520px) { .hide-sm { display: none; } }
    @media (max-width: 380px) {
      .seal { width: 66px; height: 66px; } .seal-core { inset: 14px; } .seal-core img { width: 24px; }
      .brand { gap: 10px; } h1 { font-size: 20px; } .icon-btn { width: 38px; height: 38px; }
    }
    @media (min-width: 720px) {
      .controls { grid-template-columns: 270px 1fr; align-items: center; gap: 14px; }
      h1 { font-size: 27px; }
    }

    /* ===== KPIs ===== */
    .kpis { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: -46px; }
    @media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
    .kpi {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
      padding: 14px 14px 13px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
      animation: up .6s backwards; animation-delay: calc(var(--i) * 70ms);
    }
    .kpi-label { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
    .kpi-num { font-size: 31px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; color: var(--accent); }
    .kpi-num.txt { font-size: 24px; }
    .kpi-sub { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .delta.up { color: var(--up); } .delta.down { color: var(--down); }

    /* ===== Layout principal ===== */
    .main { display: grid; gap: 18px; margin-top: 20px; align-items: start; }
    .col-main, .col-side { display: grid; gap: 14px; min-width: 0; align-content: start; }
    .col-side:empty { display: none; }
    @media (min-width: 860px) {
      .main { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 22px; }
      .col-side { position: sticky; top: 16px; }
    }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 4px 0; }
    .sec-h h2 { margin: 0; font-size: 17px; font-weight: 800; }
    .sec-h small { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; animation: up .6s backwards; }
    .card .sec-h { margin: 0 0 12px; }

    /* ===== Avatares ===== */
    .avatar {
      width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%;
      font-size: 15px; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--c);
    }
    .avatar.lg { width: 56px; height: 56px; font-size: 20px; }
    .avatar.xl { width: 72px; height: 72px; font-size: 26px; }
    .avatar.sm { width: 30px; height: 30px; font-size: 12px; }
    .av0 { --c: var(--av0); } .av1 { --c: var(--av1); } .av2 { --c: var(--av2); } .av3 { --c: var(--av3); }
    .av4 { --c: var(--av4); color: var(--ink); }

    /* ===== Estrella del día ===== */
    .star {
      position: relative; overflow: hidden; color: #fff; border-radius: var(--r); padding: 22px 20px 20px;
      background: linear-gradient(135deg, #0a6c6e, #008080 62%, #2f8f89); box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 18px; animation: up .6s backwards;
    }
    .star .wm { position: absolute; right: -30px; top: -30px; width: 170px; opacity: .14; animation: spin 70s linear infinite; }
    .star::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%);
      transform: translateX(-120%); animation: shine 5s ease-in-out 1s infinite;
    }
    .star-av { position: relative; flex: none; cursor: pointer; padding-top: 24px; }
    .star-av .avatar { color: #fff; box-shadow: 0 0 0 3px var(--gold-l), 0 8px 18px rgba(0,0,0,.25); background: rgba(255,255,255,.2); }
    .stack { display: flex; }
    .stack .avatar { margin-left: -9px; position: relative; }
    .stack .avatar:first-child { margin-left: 0; }
    .stack .avatar:nth-child(1) { z-index: 3; } .stack .avatar:nth-child(2) { z-index: 2; } .stack .avatar:nth-child(3) { z-index: 1; }
    .avatar.md { width: 48px; height: 48px; font-size: 17px; }
    .avatar.more { background: rgba(255,255,255,.28); }
    .crown { position: absolute; left: 50%; top: 0; width: 30px; height: 30px; color: var(--gold-l); transform: translateX(-50%) rotate(-8deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); animation: bob 2.6s ease-in-out infinite; }
    .star-t { position: relative; z-index: 1; min-width: 0; }
    .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-l); }
    .star-name { margin: 4px 0 2px; font-size: 25px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
    .star-count { font-size: 14.5px; font-weight: 600; opacity: .92; }

    /* ===== Podio ===== */
    .podium { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 14px 0; animation: up .6s backwards; }
    .podium::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 75% at 50% 25%, rgba(165,127,80,.18), transparent 72%); }
    .podium-head { position: relative; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-t); margin-bottom: 14px; }
    .stage { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
    .pod { flex: 1; max-width: 150px; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .pav { position: relative; margin-bottom: 8px; }
    .p1 .pav { cursor: pointer; padding-top: 22px; }
    .pod .crown { top: 0; width: 28px; height: 28px; color: #D2A24F; filter: drop-shadow(0 1px 1px rgba(36,39,42,.35)); }
    .pname { max-width: 100%; font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcount { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    .block {
      width: 100%; display: grid; place-items: start center; padding-top: 8px; border-radius: 14px 14px 0 0;
      font-size: 27px; font-weight: 800; color: #fff; transform-origin: bottom; animation: rise .9s cubic-bezier(.2,.9,.3,1.1) backwards;
    }
    .p1 .block { height: 108px; color: var(--ink); background: linear-gradient(180deg, #D9BE8E, #A57F50); animation-delay: .3s; }
    .p2 .block { height: 80px; background: linear-gradient(180deg, #7AA39B, #5C857D); animation-delay: .15s; }
    .p3 .block { height: 60px; color: var(--ink); background: linear-gradient(180deg, #BFE2DD, #9FCFCA); animation-delay: .45s; }

    /* ===== Ranking ===== */
    .list { display: grid; gap: 10px; }
    .mesera {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
      animation: up .55s backwards; animation-delay: calc(var(--i) * 55ms); transition: transform .2s;
    }
    .mesera:hover { transform: translateY(-2px); }
    .mrow {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; background: none;
      text-align: left; cursor: pointer; font-size: inherit;
    }
    .mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r); }
    .rk { position: relative; overflow: hidden; width: 26px; height: 26px; flex: none; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
    .rk.r1 { background: linear-gradient(135deg, #E4CFA9, #A57F50); color: var(--ink); }
    .rk.r1::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); transform: translateX(-120%); animation: shine 3.4s ease-in-out infinite; }
    .rk.r2 { background: var(--sage); color: #fff; }
    .rk.r3 { background: var(--aqua); color: var(--ink); }
    .minfo { flex: 1; min-width: 0; display: block; }
    .mname { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { display: block; height: 7px; margin: 7px 0 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .bar i { display: block; height: 100%; width: var(--w); border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--aqua)); transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 55ms + 150ms); }
    .bar.gold i { background: linear-gradient(90deg, var(--gold), var(--gold-l)); }
    .msub { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .mcount { min-width: 30px; text-align: right; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .chev { width: 18px; height: 18px; flex: none; color: var(--muted); transition: transform .3s; }
    .mesera.open .chev { transform: rotate(180deg); }

    .mdetail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s cubic-bezier(.2,.8,.2,1); }
    .mesera.open .mdetail { grid-template-rows: 1fr; }
    .mdetail-in { overflow: hidden; min-height: 0; }
    .dpad { margin: 0 14px; padding: 12px 0 14px; border-top: 1px dashed var(--line); }
    .dstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .dstats div { background: var(--surface-2); border-radius: 12px; padding: 9px 6px; text-align: center; min-width: 0; }
    .dstats b { display: block; font-size: 16px; font-weight: 800; }
    .dstats span { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 1px; }
    .dlabel { margin: 14px 0 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px;
      padding: 5px 5px 5px 12px; font-size: 12.5px; font-weight: 700; background: var(--accent-soft); color: var(--text); transition: transform .15s;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip i { font-style: normal; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--accent); color: var(--on-accent); }

    .quiet { display: flex; flex-wrap: wrap; gap: 8px; }
    .qp { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--muted); }
    .qp .avatar { opacity: .75; }

    /* ===== Vacío / error ===== */
    .empty { text-align: center; padding: 30px 20px 26px; }
    .empty h3 { margin: 12px 0 4px; font-size: 18px; font-weight: 800; }
    .empty p { margin: 0 auto; max-width: 320px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .empty .cup { width: 84px; height: 84px; margin: 0 auto; color: var(--gold); }
    .steam { stroke-dasharray: 14; animation: steam 2.6s ease-in-out infinite; }
    .steam:nth-of-type(2) { animation-delay: .5s; } .steam:nth-of-type(3) { animation-delay: 1s; }
    .btn { margin-top: 16px; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 20px; font-size: 14px; font-weight: 800; background: var(--accent); color: var(--on-accent); transition: transform .15s; }
    .btn:active { transform: scale(.95); }

    /* ===== Semana ===== */
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 146px; align-items: end; }
    .wk { height: 100%; border: 0; background: none; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
    .wn { font-size: 13px; font-weight: 800; }
    .wk.zero .wn { color: var(--muted); font-weight: 600; }
    .wb { width: 100%; max-width: 34px; height: var(--h); border-radius: 9px 9px 5px 5px; background: var(--accent); opacity: .55; transform-origin: bottom; animation: rise .8s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay: calc(var(--k) * 60ms); transition: opacity .2s; }
    .wk.zero .wb { background: var(--line); opacity: 1; }
    .wk:hover .wb { opacity: .85; }
    .wk.on .wb { opacity: 1; background: linear-gradient(180deg, var(--gold-l), var(--gold)); }
    .wl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .wk.on .wl { color: var(--gold-t); }

    /* ===== Calendario ===== */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-h { padding-bottom: 2px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .cell { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 11px; background: var(--surface-2); color: var(--text); cursor: pointer; transition: transform .15s; animation: pop .45s backwards; animation-delay: calc(var(--k) * 14ms); }
    .cell:hover:not(:disabled) { transform: scale(1.08); z-index: 1; }
    .cell .d { position: absolute; top: 4px; left: 6px; font-size: 9.5px; font-weight: 700; opacity: .6; }
    .cell .n { font-size: 15.5px; font-weight: 800; }
    .cell.l1 { background: var(--heat1); } .cell.l2 { background: var(--heat2); }
    .cell.l3 { background: var(--heat3); color: var(--heat-ink); } .cell.l4 { background: var(--heat4); color: var(--heat-ink); }
    .cell.l4 .d, .cell.l3 .d { opacity: .8; }
    .cell.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--gold); }
    .cell.future { opacity: .35; cursor: default; }
    .cell.blank { visibility: hidden; }
    .legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .legend i { width: 13px; height: 13px; border-radius: 4px; background: var(--surface-2); }
    .legend i:nth-child(2) { background: var(--heat1); } .legend i:nth-child(3) { background: var(--heat2); }
    .legend i:nth-child(4) { background: var(--heat3); } .legend i:nth-child(5) { background: var(--heat4); }
    .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

    /* ===== Pie, toast, confeti ===== */
    .foot { margin-top: 26px; padding-bottom: calc(26px + env(safe-area-inset-bottom)); text-align: center; font-size: 12.5px; font-weight: 500; color: var(--muted); line-height: 1.7; }
    .foot b { color: var(--gold-t); font-weight: 700; }
    #toast { position: fixed; left: 50%; bottom: 22px; z-index: 60; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: .35s; }
    #toast.on { transform: translate(-50%, 0); opacity: 1; }
    .conf { position: fixed; left: 0; top: 0; z-index: 70; width: 14px; height: 23px; pointer-events: none; animation: conf 1.25s cubic-bezier(.15,.7,.3,1) forwards; }

    /* ===== Animaciones ===== */
    @keyframes up { from { opacity: 0; transform: translateY(16px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(14deg); } }
    @keyframes bob { 0%, 100% { transform: translateX(-50%) rotate(-8deg) translateY(0); } 50% { transform: translateX(-50%) rotate(-3deg) translateY(-3px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes rise { from { transform: scaleY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } }
    @keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes steam { 0% { stroke-dashoffset: 14; opacity: 0; } 40% { opacity: 1; } 100% { stroke-dashoffset: -14; opacity: 0; } }
    @keyframes conf {
      from { transform: translate(var(--x), var(--y)) scale(.3) rotate(0); opacity: 1; }
      to { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
    }
    .still #kpis *, .still #view * { animation: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    var DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    var S = { tab: 'dia', day: null, month: null, open: null, today: null, ready: false, full: false, stale: false, offline: false, savedAt: 0,
              pending: 0, loadingRecent: false, loadingOlder: false, olderDone: false, loadedAt: 0, burstDone: false, still: false };
    var IDX = null;
    var STORE = { rows: [], from: null, older: false };

    function $(s) { return document.querySelector(s); }

    /* ---------- utilidades de fecha (todo en UTC sobre llaves yyyy-MM-dd) ---------- */
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function parseKey(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
    function toKey(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    function addDays(k, n) { var d = parseKey(k); d.setUTCDate(d.getUTCDate() + n); return toKey(d); }
    function addMonths(mk, n) { var p = mk.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); }
    function daysInMonth(mk) { var p = mk.split('-'); return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate(); }
    function wd(k) { return parseKey(k).getUTCDay(); }
    function dnum(k) { return +k.slice(8, 10); }
    function mIdx(mk) { return +mk.slice(5, 7) - 1; }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function pl(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
    function fmt1(n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); }
    function prettyName(n) { return n.toLowerCase().replace(/(^|\s)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }
    function firstName(n) { return prettyName(n).split(' ')[0]; }
    function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; }
    function avatar(name, cls) {
      var parts = prettyName(name).split(' ').filter(Boolean);
      var ini = (parts[0] || '?').charAt(0) + (parts[1] ? parts[1].charAt(0) : '');
      return '<span class="avatar av' + (hash(name) % 5) + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + esc(ini.toUpperCase()) + '</span>';
    }

    /* ---------- índice de datos ---------- */
    function buildIndex(data) {
      var byDay = {}, byMonth = {}, minDay = data.today;
      (data.rows || []).forEach(function (r) {
        var name = r[0], day = r[1], n = r[2], mk = day.slice(0, 7);
        var d = byDay[day] || (byDay[day] = { total: 0, m: {} });
        d.total += n; d.m[name] = (d.m[name] || 0) + n;
        var mo = byMonth[mk] || (byMonth[mk] = { m: {} });
        var me = mo.m[name] || (mo.m[name] = { days: {} });
        me.days[day] = (me.days[day] || 0) + n;
        if (day < minDay) minDay = day;
      });
      return { byDay: byDay, byMonth: byMonth, minDay: minDay, today: data.today, thisMonth: data.today.slice(0, 7) };
    }

    // Meseras de un mes (opcional: solo hasta el día `upTo`), ordenadas por reviews
    function monthMeseras(mk, upTo) {
      var mo = IDX.byMonth[mk], list = [], total = 0;
      if (!mo) return { total: 0, list: [] };
      Object.keys(mo.m).forEach(function (name) {
        var me = mo.m[name], c = 0, days = [];
        Object.keys(me.days).sort().forEach(function (d) {
          if (upTo && d > upTo) return;
          c += me.days[d]; days.push([d, me.days[d]]);
        });
        if (c > 0) { list.push({ name: name, count: c, days: days }); total += c; }
      });
      list.sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, 'es'); });
      return { total: total, list: list };
    }
    function monthTotal(mk, limit) {
      var t = 0;
      Object.keys(IDX.byDay).forEach(function (d) { if (d.slice(0, 7) === mk && dnum(d) <= limit) t += IDX.byDay[d].total; });
      return t;
    }
    function bestDay(mk) {
      var best = null;
      Object.keys(IDX.byDay).sort().forEach(function (d) {
        if (d.slice(0, 7) !== mk) return;
        var t = IDX.byDay[d].total;
        if (!best || t > best.n) best = { day: d, n: t };
      });
      return best;
    }
    function ranks(list) {
      var out = [], prev = null, rk = 0;
      list.forEach(function (x, i) { if (x.count !== prev) { rk = i + 1; prev = x.count; } out.push(rk); });
      return out;
    }
    function dayLabel(d) { return DIAS_C[wd(d)] + ' ' + dnum(d); }

    /* ---------- piezas de interfaz ---------- */
    function kpiHtml(k, i) {
      var v = typeof k.v === 'number'
        ? '<div class="kpi-num"><span data-count="' + k.v + '">' + k.v + '</span></div>'
        : '<div class="kpi-num' + (k.txt ? ' txt' : '') + '">' + k.v + '</div>';
      return '<div class="kpi" style="--i:' + i + '"><div class="kpi-label">' + k.l + '</div>' + v + '<div class="kpi-sub">' + k.s + '</div></div>';
    }
    function delta(cur, prev, label) {
      var d = cur - prev;
      if (d > 0) return '<span class="delta up">▲ +' + d + '</span> ' + label;
      if (d < 0) return '<span class="delta down">▼ −' + Math.abs(d) + '</span> ' + label;
      return '<span class="delta">= igual</span> ' + label;
    }
    function head(title, small) { return '<div class="sec-h"><h2>' + title + '</h2><small>' + small + '</small></div>'; }

    function meseraCard(o) {
      var open = S.open === o.name;
      var w = Math.max(6, Math.round(o.count / o.max * 100));
      var chips = o.days.map(function (d) {
        return '<button class="chip" type="button" data-act="goday" data-arg="' + d[0] + '"><span>' + dayLabel(d[0]) + '</span><i>' + d[1] + '</i></button>';
      }).join('');
      var stats = o.stats.map(function (s) { return '<div><b>' + s.v + '</b><span>' + s.l + '</span></div>'; }).join('');
      return '<article class="mesera' + (open ? ' open' : '') + '" data-name="' + esc(o.name) + '" style="--i:' + o.i + ';--w:' + w + '%">' +
        '<button class="mrow" type="button" data-act="toggle" data-arg="' + esc(o.name) + '" aria-expanded="' + open + '">' +
          '<span class="rk r' + (o.rk <= 3 ? o.rk : 'n') + '">' + o.rk + '</span>' + avatar(o.name) +
          '<span class="minfo"><span class="mname">' + esc(prettyName(o.name)) + '</span>' +
            '<span class="bar' + (o.rk === 1 ? ' gold' : '') + '"><i></i></span>' +
            '<span class="msub">' + o.sub + '</span></span>' +
          '<span class="mcount" data-count="' + o.count + '">' + o.count + '</span>' +
          '<svg class="chev" aria-hidden="true"><use href="#i-chev-d"/></svg>' +
        '</button>' +
        '<div class="mdetail"><div class="mdetail-in"><div class="dpad">' +
          '<div class="dstats">' + stats + '</div>' +
          '<div class="dlabel">' + o.chipsTitle + '</div><div class="chips">' + chips + '</div>' +
        '</div></div></div></article>';
    }

    function emptyCard(title, text, btn) {
      return '<section class="card empty"><svg class="cup" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 28h34v10a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14V28z"/><path d="M46 31h4a6 6 0 0 1 0 12h-5"/><path d="M10 58h38"/>' +
        '<path class="steam" d="M22 20c-3-3 3-5 0-9"/><path class="steam" d="M30 20c-3-3 3-5 0-9"/><path class="steam" d="M38 20c-3-3 3-5 0-9"/></svg>' +
        '<h3>' + title + '</h3><p>' + text + '</p>' + (btn || '') + '</section>';
    }

    /* ---------- vista: DÍA ---------- */
    function viewDia() {
      var day = S.day, mk = day.slice(0, 7), dd = IDX.byDay[day], isToday = day === IDX.today;
      var mtd = monthMeseras(mk, day), mtdMap = {};
      mtd.list.forEach(function (x) { mtdMap[x.name] = x; });
      var list = [];
      if (dd) Object.keys(dd.m).forEach(function (n) { list.push({ name: n, count: dd.m[n] }); });
      list.sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, 'es'); });
      var total = dd ? dd.total : 0;

      var prevDay = addDays(day, -1), prevTot = IDX.byDay[prevDay] ? IDX.byDay[prevDay].total : 0;
      var prevLabel = 'vs. ' + (prevDay === addDays(IDX.today, -1) ? 'ayer' : dayLabel(prevDay).toLowerCase());
      var kpis = [
        { l: isToday ? 'Reviews de hoy' : 'Reviews del día', v: total, s: delta(total, prevTot, prevLabel) },
        { l: 'Acumulado del mes', v: mtd.total, s: '1–' + dnum(day) + ' de ' + MESES[mIdx(mk)] },
        { l: 'Meseras con reviews', v: list.length, s: !list.length ? 'Aún sin reviews' : (list.length > 1 && list[1].count === list[0].count) ? 'Empate al frente' : 'Líder: ' + esc(firstName(list[0].name)) },
        { l: 'Promedio por día', v: fmt1(mtd.total / dnum(day)), s: 'en ' + MESES[mIdx(mk)], txt: false }
      ];

      var main = '';
      if (!list.length) {
        var last = null;
        Object.keys(IDX.byDay).forEach(function (d) { if (d < day && (!last || d > last)) last = d; });
        main += emptyCard(
          isToday ? 'Hoy aún no hay reviews' : 'Sin reviews este día',
          isToday ? 'El día apenas empieza. Cuando entren reviews con el nombre de una mesera, aparecen aquí.' : 'No se registraron reviews con mesera en esta fecha.',
          last ? '<button class="btn" type="button" data-act="goday" data-arg="' + last + '">Ver ' + DIAS_L[wd(last)] + ' ' + dnum(last) + ' de ' + MESES[mIdx(last.slice(0, 7))] + '</button>' : ''
        );
      } else {
        var top = list[0].count, leaders = list.filter(function (x) { return x.count === top; });
        var names = leaders.length === 1 ? esc(prettyName(leaders[0].name))
          : leaders.length === 2 ? esc(firstName(leaders[0].name)) + ' y ' + esc(firstName(leaders[1].name))
          : 'Empate de ' + leaders.length + ' meseras';
        var many = leaders.length > 3;
        var av = leaders.slice(0, many ? 2 : 3).map(function (l) { return avatar(l.name, leaders.length === 1 ? 'xl' : 'md'); }).join('') +
          (many ? '<span class="avatar md more" aria-hidden="true">+' + (leaders.length - 2) + '</span>' : '');
        main += '<section class="star"><svg class="wm" viewBox="0 0 100 100" aria-hidden="true"><use href="#i-trifoil"/></svg>' +
          '<div class="star-av" data-act="burst" title="¡Felicidades!"><svg class="crown" aria-hidden="true"><use href="#i-crown"/></svg><div class="stack">' + av + '</div></div>' +
          '<div class="star-t"><div class="eyebrow">' + (isToday ? 'Estrella de hoy' : 'Estrella del día') + '</div>' +
          '<div class="star-name">' + names + '</div><div class="star-count">' + pl(top, 'review', 'reviews') + (leaders.length > 1 ? ' cada una' : '') + '</div></div></section>';

        var rks = ranks(list);
        main += head(isToday ? 'Ranking de hoy' : 'Ranking del día', pl(list.length, 'mesera', 'meseras'));
        main += '<div class="list">' + list.map(function (m, i) {
          var mt = mtdMap[m.name] || { count: m.count, days: [] };
          return meseraCard({
            name: m.name, count: m.count, rk: rks[i], max: top, i: i,
            sub: pl(mt.count, 'review', 'reviews') + ' en el mes',
            stats: [
              { v: m.count, l: isToday ? 'hoy' : 'ese día' },
              { v: mt.count, l: 'en el mes' },
              { v: mt.days.length, l: mt.days.length === 1 ? 'día con review' : 'días con review' }
            ],
            chipsTitle: 'Sus días en ' + MESES[mIdx(mk)] + ' · toca para abrir',
            days: mt.days
          });
        }).join('') + '</div>';

        // Meseras activas recientemente sin reviews ese día
        var seen = {}, quiet = [];
        for (var i = 1; i <= 30; i++) {
          var o = IDX.byDay[addDays(day, -i)];
          if (o) Object.keys(o.m).forEach(function (n) { if (!seen[n] && !(dd && dd.m[n])) { seen[n] = 1; quiet.push(n); } });
        }
        if (quiet.length) {
          quiet.sort();
          main += head('Sin reviews ' + (isToday ? 'hoy' : 'ese día'), 'activas en los últimos 30 días');
          main += '<div class="quiet">' + quiet.map(function (n) { return '<span class="qp">' + avatar(n, 'sm') + esc(firstName(n)) + '</span>'; }).join('') + '</div>';
        }
      }

      // Últimos 7 días
      var days = [], tots = [], sum = 0, mx = 1;
      for (var k = 6; k >= 0; k--) days.push(addDays(day, -k));
      days.forEach(function (d) { var t = IDX.byDay[d] ? IDX.byDay[d].total : 0; tots.push(t); sum += t; if (t > mx) mx = t; });
      var side = '<section class="card"><div class="sec-h"><h2>Últimos 7 días</h2><small>' + pl(sum, 'review', 'reviews') + '</small></div><div class="week">' +
        days.map(function (d, k) {
          var t = tots[k], h = t ? Math.max(12, Math.round(t / mx * 84)) : 4;
          return '<button class="wk' + (d === day ? ' on' : '') + (t ? '' : ' zero') + '" type="button" data-act="goday" data-arg="' + d + '" style="--h:' + h + 'px;--k:' + k + '" aria-label="' + DIAS_L[wd(d)] + ' ' + dnum(d) + ': ' + pl(t, 'review', 'reviews') + '">' +
            '<span class="wn">' + t + '</span><span class="wb"></span><span class="wl">' + DIAS_C[wd(d)] + '</span></button>';
        }).join('') + '</div><p class="hint">Toca una barra para ver ese día.</p></section>';

      return { kpis: kpis, main: main, side: side };
    }

    /* ---------- vista: MES ---------- */
    function viewMes() {
      var mk = S.month, mm = monthMeseras(mk, null), isCur = mk === IDX.thisMonth;
      var elapsed = isCur ? dnum(IDX.today) : daysInMonth(mk);
      var best = bestDay(mk);
      var pMk = addMonths(mk, -1), lim = isCur ? dnum(IDX.today) : 31;
      var hasPrev = !!IDX.byMonth[pMk];
      var cmp = hasPrev ? delta(mm.total, monthTotal(pMk, lim), 'vs. ' + MESES_C[mIdx(pMk)] + (isCur ? ' 1–' + lim : '')) : 'Sin mes anterior';
      var list = mm.list;
      var kpis = [
        { l: 'Reviews del mes', v: mm.total, s: cmp },
        { l: 'Promedio por día', v: fmt1(mm.total / elapsed), s: 'en ' + pl(elapsed, 'día', 'días') },
        { l: 'Mejor día', v: best && best.n ? dayLabel(best.day) : '–', s: best && best.n ? pl(best.n, 'review', 'reviews') : 'Sin reviews', txt: true },
        { l: 'Meseras con reviews', v: list.length, s: list.length ? 'Líder: ' + esc(firstName(list[0].name)) : 'Aún sin reviews' }
      ];

      var main = '', side = '';
      if (!list.length) {
        main = emptyCard('Sin reviews en ' + MESES[mIdx(mk)],
          isCur ? 'Cuando lleguen las primeras reviews del mes con el nombre de una mesera, aparecerán aquí.' : 'No hay reviews con mesera registradas en este mes.');
        return { kpis: kpis, main: main, side: side };
      }

      var rks = ranks(list), top3 = list.slice(0, 3);
      var order = top3.length === 1 ? [0] : top3.length === 2 ? [1, 0] : [1, 0, 2];
      main += '<section class="podium"><div class="podium-head">' + (isCur ? 'Mesera del mes · en carrera' : 'Mesera del mes') + '</div><div class="stage">' +
        order.map(function (ix) {
          var m = top3[ix], pos = ix + 1;
          return '<div class="pod p' + pos + '"><div class="pav"' + (pos === 1 ? ' data-act="burst"' : '') + '>' +
            (pos === 1 ? '<svg class="crown" aria-hidden="true"><use href="#i-crown"/></svg>' : '') + avatar(m.name, 'lg') + '</div>' +
            '<div class="pname">' + esc(firstName(m.name)) + '</div><div class="pcount">' + pl(m.count, 'review', 'reviews') + '</div>' +
            '<div class="block"><span>' + rks[ix] + '</span></div></div>';
        }).join('') + '</div></section>';

      main += head('Ranking de ' + MESES[mIdx(mk)], pl(list.length, 'mesera', 'meseras'));
      main += '<div class="list">' + list.map(function (m, i) {
        var b = null;
        m.days.forEach(function (d) { if (!b || d[1] > b[1]) b = d; });
        var pct = Math.round(m.count / mm.total * 100);
        return meseraCard({
          name: m.name, count: m.count, rk: rks[i], max: list[0].count, i: i,
          sub: pct + '% del mes',
          stats: [
            { v: pct + '%', l: 'del mes' },
            { v: m.days.length, l: m.days.length === 1 ? 'día con review' : 'días con review' },
            { v: dayLabel(b[0]), l: 'mejor día (' + b[1] + ')' }
          ],
          chipsTitle: 'Día por día · toca para abrir',
          days: m.days
        });
      }).join('') + '</div>';

      // Calendario de calor
      var n = daysInMonth(mk), first = (wd(mk + '-01') + 6) % 7, mx = 1, cells = '';
      for (var d = 1; d <= n; d++) { var t0 = IDX.byDay[mk + '-' + pad(d)]; if (t0 && t0.total > mx) mx = t0.total; }
      for (var b2 = 0; b2 < first; b2++) cells += '<span class="cell blank"></span>';
      for (var dd2 = 1; dd2 <= n; dd2++) {
        var key = mk + '-' + pad(dd2), t = IDX.byDay[key] ? IDX.byDay[key].total : 0, r = t / mx;
        var lvl = !t ? 0 : r <= .25 ? 1 : r <= .5 ? 2 : r <= .8 ? 3 : 4, future = key > IDX.today;
        cells += '<button class="cell l' + lvl + (key === IDX.today ? ' today' : '') + (future ? ' future' : '') + '" type="button"' + (future ? ' disabled' : '') +
          ' data-act="goday" data-arg="' + key + '" style="--k:' + dd2 + '" aria-label="' + DIAS_L[wd(key)] + ' ' + dd2 + ': ' + pl(t, 'review', 'reviews') + '">' +
          '<span class="d">' + dd2 + '</span><span class="n">' + (t || '') + '</span></button>';
      }
      side = '<section class="card"><div class="sec-h"><h2>' + cap(MESES[mIdx(mk)]) + '</h2><small>Reviews por día</small></div>' +
        '<div class="cal-grid">' + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function (h) { return '<div class="cal-h">' + h + '</div>'; }).join('') + cells + '</div>' +
        '<div class="legend">Menos <i></i><i></i><i></i><i></i><i></i> Más</div><p class="hint">Toca un día para ver sus reviews.</p></section>';

      return { kpis: kpis, main: main, side: side };
    }

    /* ---------- render ---------- */
    function syncControls() {
      var seg = $('#seg');
      seg.setAttribute('data-tab', S.tab);
      [].forEach.call(seg.querySelectorAll('button'), function (b) { b.setAttribute('aria-selected', String(b.dataset.arg === S.tab)); });
      var label = $('#navLabel'), prev = $('#prevBtn'), next = $('#nextBtn'), pill = $('#todayBtn');
      if (S.tab === 'dia') {
        var d = S.day, isT = d === IDX.today, yearTxt = d.slice(0, 4) !== IDX.today.slice(0, 4) ? ' ' + d.slice(0, 4) : '';
        var eb = (isT ? 'Hoy · ' : d === addDays(IDX.today, -1) ? 'Ayer · ' : '') + DIAS_L[wd(d)];
        label.innerHTML = '<span class="nav-eyebrow">' + eb + '</span><span class="nav-main">' + dnum(d) + ' de ' + MESES[mIdx(d.slice(0, 7))] + yearTxt + '</span>';
        prev.disabled = d <= floorDay(); next.disabled = d >= IDX.today;
        pill.hidden = isT; pill.textContent = 'Hoy';
      } else {
        var mk = S.month, cur = IDX.thisMonth;
        var eb2 = mk === cur ? 'Este mes' : mk === addMonths(cur, -1) ? 'Mes pasado' : 'Historial';
        var opts = '', k = cur, guard = 0, minMk = floorDay().slice(0, 7);
        while (guard++ < 240) { opts += '<option value="' + k + '"' + (k === mk ? ' selected' : '') + '>' + cap(MESES[mIdx(k)]) + ' ' + k.slice(0, 4) + '</option>'; if (k <= minMk) break; k = addMonths(k, -1); }
        if (!S.full) opts += '<option disabled>Cargando meses anteriores…</option>';
        label.innerHTML = '<span class="nav-eyebrow">' + eb2 + '</span><span class="nav-main">' + cap(MESES[mIdx(mk)]) + ' ' + mk.slice(0, 4) + '</span><select id="monthSel" aria-label="Elegir mes">' + opts + '</select>';
        prev.disabled = mk <= minMk; next.disabled = mk >= cur;
        pill.hidden = mk === cur; pill.textContent = 'Actual';
      }
    }

    function render(animate) {
      S.still = !animate || REDUCE;
      document.body.classList.toggle('still', S.still);
      syncControls();
      var v = S.tab === 'dia' ? viewDia() : viewMes();
      $('#kpis').innerHTML = v.kpis.map(kpiHtml).join('');
      $('#view').innerHTML = '<div class="col-main">' + v.main + '</div><aside class="col-side">' + v.side + '</aside>';
      updTime();
      if (!S.still) { runCounts(); maybeBurst(); }
    }

    function runCounts() {
      [].forEach.call(document.querySelectorAll('[data-count]'), function (el) {
        var to = +el.getAttribute('data-count'); if (!to) return;
        var t0 = performance.now(), dur = 900; el.textContent = '0';
        (function step(t) {
          var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(to * e);
          if (p < 1) requestAnimationFrame(step);
        })(t0);
      });
    }

    function hora(ms) {
      var d = new Date(ms);
      try { return d.toLocaleTimeString('es-PR', { timeZone: 'America/Puerto_Rico', hour: 'numeric', minute: '2-digit' }); }
      catch (e) { return d.toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' }); }
    }
    function updTime() {
      var el = $('#upd');
      if (S.offline) el.textContent = 'Sin conexión · mostrando datos guardados' + (S.savedAt ? ' de las ' + hora(S.savedAt) : '');
      else if (S.stale) el.textContent = 'Actualizando…';
      else el.textContent = 'Actualizado a las ' + hora(Date.now()) + ' · datos directo de la hoja de reviews';
    }

    /* ---------- efectos ---------- */
    function burst(el) {
      if (!el || REDUCE) return;
      var r = el.getBoundingClientRect(), cx = r.left + r.width / 2 - 7, cy = r.top + r.height / 2 - 11;
      var colors = ['#A57F50', '#008080', '#9FCFCA', '#C9A878', '#5C857D'];
      for (var i = 0; i < 18; i++) {
        var s = document.createElement('span'), a = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 120;
        s.className = 'conf';
        s.style.cssText = '--x:' + cx + 'px;--y:' + cy + 'px;--dx:' + (Math.cos(a) * dist).toFixed(0) + 'px;--dy:' + (Math.sin(a) * dist - 40).toFixed(0) + 'px;--rot:' + (Math.random() * 540 - 270).toFixed(0) + 'deg;color:' + colors[i % 5];
        s.innerHTML = '<svg viewBox="0 0 24 40" width="100%" height="100%"><use href="#i-bean"/></svg>';
        document.body.appendChild(s);
        setTimeout((function (n) { return function () { if (n.parentNode) n.parentNode.removeChild(n); }; })(s), 1400);
      }
    }
    function maybeBurst() {
      if (S.burstDone) return;
      var el = document.querySelector('.star-av') || document.querySelector('.p1 .pav');
      if (!el) return;
      S.burstDone = true;
      setTimeout(function () { burst(document.querySelector('.star-av') || document.querySelector('.p1 .pav')); }, 800);
    }
    function toast(msg) {
      var t = $('#toast'); t.textContent = msg; t.classList.add('on');
      clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 3200);
    }

    /* ---------- tema ---------- */
    function isDark() {
      var t = document.documentElement.getAttribute('data-theme');
      return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    }
    function themeIcon() { $('#themeBtn').innerHTML = '<svg><use href="#' + (isDark() ? 'i-sun' : 'i-moon') + '"/></svg>'; }
    try { var saved = localStorage.getItem('hyc-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
    themeIcon();

    /* ---------- acciones ---------- */
    function lastDayOf(mk) { return mk === IDX.thisMonth ? IDX.today : mk + '-' + pad(daysInMonth(mk)); }
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el || !IDX && el.getAttribute('data-act') !== 'refresh') return;
      var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
      switch (act) {
        case 'tab':
          if (S.tab === arg) return;
          if (arg === 'mes') S.month = S.day.slice(0, 7);
          else if (S.day.slice(0, 7) !== S.month) S.day = lastDayOf(S.month);
          S.tab = arg; S.open = null; render(true); break;
        case 'prev':
        case 'next':
          var s = act === 'prev' ? -1 : 1;
          if (S.tab === 'dia') S.day = addDays(S.day, s); else S.month = addMonths(S.month, s);
          S.open = null; render(true); break;
        case 'today':
          if (S.tab === 'dia') S.day = IDX.today; else S.month = IDX.thisMonth;
          S.open = null; render(true); break;
        case 'goday':
          S.day = arg; S.month = arg.slice(0, 7); S.tab = 'dia'; S.open = null; render(true);
          window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' }); break;
        case 'toggle':
          var cards = document.querySelectorAll('.mesera'), willOpen = S.open !== arg;
          [].forEach.call(cards, function (c) {
            var on = willOpen && c.getAttribute('data-name') === arg;
            c.classList.toggle('open', on);
            c.querySelector('.mrow').setAttribute('aria-expanded', String(on));
          });
          S.open = willOpen ? arg : null; break;
        case 'burst': burst(el); break;
        case 'refresh': fetchRecent(true, false); break;
        case 'theme':
          var next2 = isDark() ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next2);
          try { localStorage.setItem('hyc-theme', next2); } catch (err) {}
          themeIcon(); break;
      }
    });
    document.addEventListener('change', function (e) {
      if (e.target && e.target.id === 'monthSel') { S.month = e.target.value; S.open = null; render(true); }
    });

    // Deslizar para cambiar de día o mes
    var tx = 0, ty = 0;
    $('#view').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    $('#view').addEventListener('touchend', function (e) {
      if (!IDX) return;
      var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
      var btn = dx > 0 ? $('#prevBtn') : $('#nextBtn');
      if (!btn.disabled) btn.click();
    }, { passive: true });

    /* ---------- carga de datos: por fases + copia local ---------- */
    var LS_KEY = 'hyc-data-v2';

    function prToday() {
      try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Puerto_Rico', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
      catch (e) { return toKey(new Date(Date.now() - 4 * 3600000)); }
    }
    // Primer día al que se puede navegar: antes de cargar los meses viejos, el inicio del mes anterior
    function floorDay() { return S.full ? IDX.minDay : STORE.from + '-01'; }
    function normalizeState() {
      var fl = floorDay();
      if (fl > IDX.today) fl = IDX.today;
      if (S.day > IDX.today) S.day = IDX.today;
      if (S.day < fl) S.day = fl;
      if (S.month > IDX.thisMonth) S.month = IDX.thisMonth;
      if (S.month < fl.slice(0, 7)) S.month = fl.slice(0, 7);
    }
    function readLocal() {
      try {
        var c = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
        if (c && Array.isArray(c.rows) && typeof c.from === 'string' && Date.now() - c.savedAt < 86400000) return c;
      } catch (e) {}
      return null;
    }
    function saveLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ rows: STORE.rows, from: STORE.from, older: STORE.older, savedAt: Date.now() })); } catch (e) {}
    }
    function busy(n) { S.pending += n; $('#refBtn').classList.toggle('spin', S.pending > 0); }
    function hideLoader() { $('#loader').classList.add('out'); }

    // Une lo que llegó del servidor con lo que ya había
    function ingest(p) {
      var recent = p.scope === 'recent';
      STORE.rows = STORE.rows.filter(function (r) { var m = r[1].slice(0, 7); return recent ? m < p.from : m >= p.from; }).concat(p.rows);
      STORE.from = p.from;
      if (!recent) STORE.older = true;
      S.full = STORE.older; S.today = p.today;
      IDX = buildIndex({ today: S.today, rows: STORE.rows });
      saveLocal();
    }

    // Fase 1: mes actual y anterior
    function fetchRecent(force, silent) {
      if (S.loadingRecent) return;
      S.loadingRecent = true; busy(1);
      google.script.run
        .withSuccessHandler(function (p) {
          S.loadingRecent = false; busy(-1);
          var first = !S.ready, prevToday = S.today, prevThis = IDX && IDX.thisMonth;
          ingest(p);
          S.stale = false; S.offline = false; S.loadedAt = Date.now();
          if (first) { S.day = IDX.today; S.month = IDX.thisMonth; }
          else {
            if (S.day === prevToday) S.day = IDX.today;
            if (S.month === prevThis) S.month = IDX.thisMonth;
          }
          normalizeState();
          S.ready = true; hideLoader();
          render(first);
          if (!silent && !first) toast('Datos al día');
          if (!S.olderDone) fetchOlder();
        })
        .withFailureHandler(function () {
          S.loadingRecent = false; busy(-1); hideLoader();
          if (S.ready) {
            if (S.stale) { S.offline = true; updTime(); }
            if (!silent) toast('No se pudo actualizar. Intenta de nuevo.');
            return;
          }
          $('#kpis').innerHTML = '';
          $('#view').innerHTML = '<div class="col-main">' + emptyCard('No pudimos cargar las reviews', 'Revisa tu conexión e intenta de nuevo en un momento.', '<button class="btn" type="button" data-act="refresh">Reintentar</button>') + '</div>';
        })
        .getRecentData(!!force);
    }

    // Fase 2: meses anteriores, en segundo plano
    function fetchOlder() {
      if (S.loadingOlder) return;
      S.loadingOlder = true; busy(1);
      google.script.run
        .withSuccessHandler(function (p) {
          S.loadingOlder = false; busy(-1); S.olderDone = true;
          ingest(p); normalizeState(); render(false);
        })
        .withFailureHandler(function () {
          S.loadingOlder = false; busy(-1); S.olderDone = false;
          toast('No se pudieron cargar los meses anteriores. Toca actualizar para reintentar.');
        })
        .getOlderData();
    }

    document.addEventListener('visibilitychange', function () { if (!document.hidden && S.ready && Date.now() - S.loadedAt > 180000) fetchRecent(false, true); });
    setInterval(function () { if (!document.hidden && S.ready) fetchRecent(false, true); }, 300000);

    // Arranque: si hay copia reciente de hoy, se muestra al instante mientras se actualiza
    (function boot() {
      var c = readLocal(), t = prToday();
      if (c && c.from === addMonths(t.slice(0, 7), -1)) {
        STORE = { rows: c.rows, from: c.from, older: !!c.older };
        S.full = STORE.older; S.today = t; S.savedAt = c.savedAt; S.stale = true;
        IDX = buildIndex({ today: t, rows: STORE.rows });
        S.day = IDX.today; S.month = IDX.thisMonth;
        normalizeState();
        S.ready = true; hideLoader(); render(true);
      }
      fetchRecent(false, true);
    })();
  })();
  </script>
</body>
</html>
